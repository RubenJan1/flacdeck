appId: nl.flacdeck.app
productName: FlacDeck
copyright: FlacDeck

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  - '!**/*.map'

# ffmpeg en ffprobe zijn losse executables; die moeten buiten het asar-archief
# blijven, anders kan het besturingssysteem ze niet starten.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  # ffprobe-static levert binaries voor élk platform mee; die van de andere
  # systemen scheelt honderden megabytes in de installer.
  files:
    - '!node_modules/ffprobe-static/bin/darwin/**'
    - '!node_modules/ffprobe-static/bin/linux/**'
    - '!node_modules/ffprobe-static/bin/win32/ia32/**'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: FlacDeck

mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  darkModeSupport: true
  files:
    - '!node_modules/ffprobe-static/bin/win32/**'
    - '!node_modules/ffprobe-static/bin/linux/**'
  # Zonder Apple Developer-account is de app niet ondertekend. Hardened runtime
  # uitzetten voorkomt dat macOS 'm daarna alsnog weigert te starten.
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  extendInfo:
    LSMinimumSystemVersion: '11.0'
    NSMicrophoneUsageDescription: FlacDeck gebruikt geen microfoon.

dmg:
  title: ${productName}
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

linux:
  target:
    - AppImage
  category: Audio
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

publish: null
