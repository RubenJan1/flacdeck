name: Build

# Bouwt de installers voor Windows en macOS en zet ze in een release.
# macOS-builds moeten op een Mac-runner draaien; die levert GitHub gratis.
#
# Nieuwe versie uitbrengen:
#   1. versienummer ophogen in package.json
#   2. git commit + git tag v1.0.1 + git push --follow-tags
# Daarna staat er binnen ~10 minuten een release met .exe en .dmg klaar,
# en zien bestaande gebruikers de update vanzelf in de app.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            naam: windows
          - os: macos-latest
            naam: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests zonder netwerk
        run: |
          npm run test:unit
          npm run test:licence

      # Eerst de code bundelen naar out/. electron-builder pakt alleen in en
      # bouwt niets: zonder deze stap ontbreekt out/main/index.js in de asar.
      - name: Bundelen
        run: npm run build

      - name: Controleren dat de bundel er is
        shell: bash
        run: |
          test -f out/main/index.js || { echo "out/main/index.js ontbreekt na de bundelstap"; exit 1; }
          test -f out/preload/index.js || { echo "out/preload/index.js ontbreekt"; exit 1; }
          test -f out/renderer/index.html || { echo "out/renderer/index.html ontbreekt"; exit 1; }

      # --publish always laadt de installers rechtstreeks in de release van deze
      # tag, inclusief de latest.yml / latest-mac.yml die de updater nodig heeft.
      - name: Inpakken en publiceren
        run: npx electron-builder --${{ matrix.naam == 'windows' && 'win' || 'mac' }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Niet ondertekenen: er is geen Apple Developer-certificaat ingesteld.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Installers bewaren als artifact
        uses: actions/upload-artifact@v4
        with:
          name: flacdeck-${{ matrix.naam }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.yml
          if-no-files-found: warn
          retention-days: 14
