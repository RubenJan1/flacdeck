name: Build

# Bouwt installers voor Windows en macOS en zet ze in een release.
#
# Nieuwe versie uitbrengen:
#   1. versienummer ophogen in package.json
#   2. git commit + git push
#   3. git tag v1.0.3
#   4. git push origin v1.0.3
#
# Dit maakt:
#   - Windows x64
#   - macOS arm64 (Apple Silicon)
#   - macOS x64 (Intel)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            naam: windows
            builder-target: win
            builder-arch: x64

          # Mac Apple Silicon
          - os: macos-latest
            naam: macos-arm64
            builder-target: mac
            builder-arch: arm64

          # Mac Intel
          - os: macos-latest
            naam: macos-x64
            builder-target: mac
            builder-arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests zonder netwerk
        run: |
          npm run test:unit
          npm run test:licence

      # Eerst de code bundelen naar out/.
      - name: Bundelen
        run: npm run build

      - name: Controleren dat de bundel er is
        shell: bash
        run: |
          test -f out/main/index.js || { echo "out/main/index.js ontbreekt na de bundelstap"; exit 1; }
          test -f out/preload/index.js || { echo "out/preload/index.js ontbreekt"; exit 1; }
          test -f out/renderer/index.html || { echo "out/renderer/index.html ontbreekt"; exit 1; }

      # Iedere job bouwt precies één platform/architectuur.
      - name: Inpakken en publiceren
        run: npx electron-builder --${{ matrix.builder-target }} --${{ matrix.builder-arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Installers bewaren als artifact
        uses: actions/upload-artifact@v4
        with:
          name: flacdeck-${{ matrix.naam }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.yml
          if-no-files-found: warn
          retention-days: 14